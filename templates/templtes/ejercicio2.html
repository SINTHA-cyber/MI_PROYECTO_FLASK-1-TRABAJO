<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>Comparar nombres</title>

</head>

<body>

    <h1>Formulario de Nombres</h1>

    <form action="/ejercicio2" method="post">

        <label>Nombre 1:</label>

        <input type="text" name="nombre1" required>

        <br><br>

        <label>Nombre 2:</label>

        <input type="text" name="nombre2" required>

        <br><br>

        <label>Nombre 3:</label>

        <input type="text" name="nombre3" required>

        <br><br>

        <button type="submit">Enviar</button>

    </form>

    {% if nombre_mayor %}

        <h2>El nombre con mayor cantidad de caracteres es: {{ nombre_mayor }}</h2>

        <h2>El nombre tiene: {{ cantidad_caracteres }} caracteres</h2>

    {% endif %}

    <p><a href="/">Volver al menú principal</a></p>

</body>

</html>
