<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>Formulario de Notas</title>

</head>

<body>

    <h1>Formulario de Notas</h1>

    <form action="/ejercicio1" method="post">

        <label>Nota 1:</label>

        <input type="number" name="nota1" min="10" max="70" step="any" required>

        <br><br>

        <label>Nota 2:</label>

        <input type="number" name="nota2" min="10" max="70" step="any" required>

        <br><br>

        <label>Nota 3:</label>

        <input type="number" name="nota3" min="10" max="70" step="any" required>

        <br><br>

        <label>Asistencia (%):</label>

        <input type="number" name="asistencia" min="0" max="100" required>

        <br><br>

        <button type="submit">Enviar</button>

    </form>

    {% if promedio is not none %}

        <h2>Promedio: {{ promedio }}</h2>

        <h2>Resultado: {{ estado }}</h2>

    {% endif %}

    <p><a href="/">Volver al menú principal</a></p>

</body>

</html>
